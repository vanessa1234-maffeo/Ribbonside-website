<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" type="image/png" href="../pink-ribbon.png">
<title>Ribbonside Mission Control</title>
<style>
:root{
  --cream:#FDFAF8; --pink:#EB94AE; --pink-light:#FFF0F5; --pink-mid:#F2C4D4;
  --ink:#1E1414; --ink-soft:#2A1E1E; --muted:#7A6060; --border:#EAE0E0;
  --green:#DCEFE5; --green-text:#2E6B4C; --amber:#8A5A00; --amber-bg:#FFF3DC;
  --danger:#B03B3B; --danger-bg:#FCE9E9;
  --sidebar:#1E1414; --sidebar-2:#2A1D1D; --sidebar-line:#3A2A2A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer}
a{color:var(--pink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d8cccc;border-radius:8px}
#app{display:grid;grid-template-columns:252px 1fr;height:100vh}
.sidebar{background:var(--sidebar);color:#fff;display:flex;flex-direction:column;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.sb-brand .logo{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:17px}
.sb-brand .t{font-family:"Lora",Georgia,serif;font-size:16px;font-weight:600;line-height:1.1}
.sb-brand .s{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink-mid)}
.sb-scroll{flex:1;overflow-y:auto;padding:6px 8px 14px}
.sb-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9a8585;margin:14px 8px 6px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#e7dcdc;text-align:left;padding:8px 10px;border-radius:9px;font-size:13.5px;transition:.12s}
.navitem:hover{background:var(--sidebar-2);color:#fff}
.navitem.active{background:var(--pink);color:#241010;font-weight:600}
.navitem .em{width:20px;text-align:center;flex:0 0 auto;font-size:15px}
.navitem .meta{margin-left:auto;font-size:10px;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:20px}
.navitem.active .meta{background:rgba(0,0,0,.14)}
.sb-foot{padding:10px 14px;border-top:1px solid var(--sidebar-line);font-size:11px;color:#9a8585;display:flex;align-items:center;justify-content:space-between}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.on{background:#5ed19a}.dot.off{background:#d98a8a}
.work{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--cream)}
#previewBar{background:#241010;color:#ffd9e5;font-size:12.5px;padding:8px 14px;display:none;align-items:center;gap:10px;justify-content:center;border-bottom:1px solid var(--sidebar-line)}
#previewBar b{color:#fff}
#previewBar button{margin-left:8px;background:rgba(255,255,255,.14);border:0;color:#ffd9e5;border-radius:6px;padding:2px 8px;font-size:11px}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:#fff}
.topbar .ttl{font-family:"Lora",Georgia,serif;font-size:19px;font-weight:600;display:flex;align-items:center;gap:9px}
.topbar .sub{font-size:12px;color:var(--muted)}
.topbar .sp{flex:1}
.btn{border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;transition:.12s}
.btn:hover{border-color:var(--pink);color:var(--pink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:var(--pink);border-color:var(--pink);color:#241010}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--danger);border-color:#e9c9c9}
.btn.danger:hover{background:var(--danger-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.body{flex:1;overflow-y:auto;padding:0}
.chat-wrap{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;padding:22px clamp(16px,5vw,60px)}
.msgs .inner{max-width:820px;margin:0 auto}
.msg{margin-bottom:18px;display:flex;gap:12px}
.msg .av{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:16px;background:var(--pink-light);border:1px solid var(--pink-mid)}
.msg.user .av{background:var(--ink);color:#fff;border-color:var(--ink)}
.msg .bub{flex:1;min-width:0}
.msg .who{font-size:12px;font-weight:700;margin-bottom:2px;color:var(--ink-soft)}
.msg .who .frm{color:var(--muted);font-weight:500}
.msg .txt{background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:14.5px;overflow-wrap:anywhere}
.msg.user .txt{background:var(--pink-light);border-color:var(--pink-mid)}
.msg .txt h1,.msg .txt h2,.msg .txt h3{font-family:"Lora",Georgia,serif;margin:.5em 0 .3em;line-height:1.25}
.msg .txt h1{font-size:20px}.msg .txt h2{font-size:17px}.msg .txt h3{font-size:15px}
.msg .txt p{margin:.5em 0}.msg .txt ul,.msg .txt ol{margin:.5em 0 .5em 1.2em}
.msg .txt li{margin:.2em 0}
.msg .txt code{background:#f3ebe9;padding:1px 5px;border-radius:5px;font-size:.9em}
.msg .txt a{word-break:break-all}
.relaybar{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.relaybar .lbl{font-size:11px;color:var(--muted)}
.chip{font-size:11.5px;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:20px;padding:3px 10px}
.chip:hover{border-color:var(--pink);color:var(--pink)}
.chip.suggest{border-color:var(--pink-mid);background:var(--pink-light)}
.composer{border-top:1px solid var(--border);background:#fff;padding:12px clamp(16px,5vw,60px)}
.composer .inner{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-family:inherit;font-size:14.5px;max-height:180px;min-height:46px;line-height:1.45}
.composer textarea:focus{outline:none;border-color:var(--pink)}
.composer .send{height:46px;width:46px;border-radius:12px;background:var(--ink);color:#fff;border:0;font-size:18px;display:grid;place-items:center;flex:0 0 auto}
.composer .send:hover{background:var(--pink);color:#241010}
.composer .hint{max-width:820px;margin:6px auto 0;font-size:11px;color:var(--muted)}
.empty{max-width:560px;margin:8vh auto;padding:0 20px;text-align:center}
.empty .em{font-size:40px}
.empty h2{font-family:"Lora",Georgia,serif;font-size:24px;margin:10px 0}
.empty p{color:var(--muted);font-size:14px;margin-bottom:16px}
.comms{max-width:900px;margin:0 auto;padding:22px clamp(16px,4vw,40px)}
.comms-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.comms-item .rail{flex:0 0 auto;width:120px;font-size:12px;color:var(--muted)}
.comms-item .body2{flex:1;min-width:0}
.comms-item .route{font-size:12.5px;font-weight:700;margin-bottom:3px}
.comms-item .route .arrow{color:var(--pink);margin:0 5px}
.tag-kind{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:20px;margin-left:8px}
.tag-kind.relay{background:var(--pink-light);color:#a24d67}
.tag-kind.reply{background:var(--green);color:var(--green-text)}
.tag-kind.broadcast{background:var(--amber-bg);color:var(--amber)}
.comms-item .snip{font-size:13.5px;color:var(--ink-soft);white-space:pre-wrap;overflow-wrap:anywhere}
.board{display:flex;gap:14px;padding:20px;overflow-x:auto;height:100%;align-items:flex-start}
.col{flex:0 0 260px;background:#fff;border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;max-height:100%}
.col h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 14px 8px;display:flex;justify-content:space-between}
.col .cards{padding:0 10px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.card{border:1px solid var(--border);border-radius:11px;padding:11px;background:var(--cream)}
.card .ct{font-weight:600;font-size:14px;margin-bottom:3px}
.card .cd{font-size:12px;color:var(--muted);margin-bottom:8px;overflow-wrap:anywhere}
.card .crow{display:flex;gap:6px;flex-wrap:wrap}
.card .mini{font-size:11px;border:1px solid var(--border);background:#fff;border-radius:7px;padding:3px 7px}
.card .mini:hover{border-color:var(--pink);color:var(--pink)}
.card .sched{font-size:11px;color:var(--amber);background:var(--amber-bg);border-radius:6px;padding:2px 7px;display:inline-block;margin-top:6px}
.addcard{border:1px dashed var(--pink-mid);color:#a24d67;background:var(--pink-light);border-radius:10px;padding:9px;font-size:13px;font-weight:600;width:100%}
.panel-wrap{max-width:860px;margin:0 auto;padding:22px clamp(16px,4vw,40px)}
.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.panel h3{font-family:"Lora",Georgia,serif;font-size:17px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.panel p.d{font-size:13px;color:var(--muted);margin-bottom:12px}
.panel .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:block;margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pink)}
.check{display:flex;align-items:flex-start;gap:9px;padding:8px 0;font-size:13.5px}
.check .ic{flex:0 0 auto;width:20px}
.check .ok{color:var(--green-text)}.check .warn{color:var(--amber)}.check .bad{color:var(--danger)}
.note{font-size:12px;color:var(--muted);background:var(--cream);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-top:8px}
.kv{font-size:13px;color:var(--muted);margin:4px 0}
table.mx{width:100%;border-collapse:collapse;font-size:13.5px}
table.mx th{text-align:left;color:var(--muted);font-weight:600;padding:6px 4px}
table.mx td{padding:6px 4px;border-top:1px solid var(--border)}
.overlay{position:fixed;inset:0;background:rgba(30,20,20,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow-y:auto;padding:22px}
.modal h3{font-family:"Lora",Georgia,serif;font-size:20px;margin-bottom:14px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.prose{font-size:14.5px}
.prose h1,.prose h2,.prose h3{font-family:"Lora",Georgia,serif;margin:.6em 0 .3em}
.prose ul,.prose ol{margin:.5em 0 .5em 1.2em}.prose p{margin:.5em 0}
#lock{position:fixed;inset:0;background:var(--ink);color:#fff;display:none;align-items:center;justify-content:center;z-index:100}
#lock.on{display:flex}
#lock .box{text-align:center;width:280px}
#lock .lk{font-size:44px}
#lock h2{font-family:"Lora",Georgia,serif;font-size:22px;margin:10px 0 6px}
#lock p{font-size:12px;color:var(--pink-mid);margin-bottom:16px}
#lock input{width:100%;border:0;border-radius:10px;padding:12px;font-size:16px;text-align:center;letter-spacing:.3em;margin-bottom:10px}
#lock button{width:100%;border:0;background:var(--pink);color:#241010;font-weight:700;border-radius:10px;padding:12px}
#lock .err{color:#ffb3b3;font-size:12px;height:16px;margin-top:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:80vw}
#toast.on{opacity:1}
@media(max-width:820px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:252px;z-index:40;transform:translateX(-100%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{transform:none}
  #menubtn{display:inline-flex}
}
#menubtn{display:none}
</style>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="lock"><div class="box"><div class="lk">🎀</div><h2>Mission Control</h2><p>PRIVATE · ENTER PIN</p>
  <input id="lockpin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••"><button id="lockbtn">Unlock</button><div class="err" id="lockerr"></div></div></div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><div class="logo">🎀</div><div><div class="t">Ribbonside</div><div class="s">Mission Control</div></div></div>
    <div class="sb-scroll">
      <div class="sb-label">Agents</div>
      <div id="agentNav"></div>
      <div class="sb-label">Operations</div>
      <button class="navitem" data-view="tracker"><span class="em">📊</span>Growth Tracker<span class="meta" id="trackerCount">0</span></button>
      <button class="navitem" data-view="comms"><span class="em">📡</span>Team Comms<span class="meta" id="commsCount">0</span></button>
      <button class="navitem" data-view="blog"><span class="em">🗂️</span>Blog Board<span class="meta" id="blogCount">0</span></button>
      <button class="navitem" data-view="backup"><span class="em">🛡️</span>Backup &amp; Security</button>
      <button class="navitem" data-view="settings"><span class="em">⚙️</span>Settings</button>
    </div>
    <div class="sb-foot"><span><span class="dot off" id="keyDot"></span><span id="keyState">No API key</span></span><span id="modelFoot">—</span></div>
  </aside>
  <main class="work">
    <div id="previewBar"></div>
    <div class="topbar">
      <button class="btn sm" id="menubtn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div><div class="ttl" id="viewTitle">Mission Control</div><div class="sub" id="viewSub"></div></div>
      <div class="sp"></div><div id="topActions"></div>
    </div>
    <div class="body" id="viewBody"></div>
  </main>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
"use strict";
const PREVIEW = !/ribbonside/i.test(location.hostname);
const STORE_KEY = "ribbonside_mc_v2";
const API_URL = "https://api.anthropic.com/v1/messages";
const STATUSES = ["idea","draft","review","scheduled","published"];
const STATUS_LABEL = {idea:"Ideas",draft:"Drafts",review:"In review",scheduled:"Scheduled",published:"Published"};
const MODELS = [
  {id:"claude-sonnet-5", name:"Claude Sonnet 5 — balanced (recommended)"},
  {id:"claude-opus-4-8", name:"Claude Opus 4.8 — most capable"},
  {id:"claude-haiku-4-5", name:"Claude Haiku 4.5 — fastest / lowest cost"}
];
const SHARED_BRIEF = `You are part of the Ribbonside Mission Control team.

ABOUT RIBBONSIDE
- Ribbonside is a private, local-first mobile app (iOS + Android): a calm organiser for the practical side of breast cancer (appointments, medications, notes, photos, documents).
- Website: ribbonside.com.au. Free on the Australian App Store and Google Play, with optional Plus features via Apple/Google subscriptions.
- Built by Vanessa, the founder, after her own breast cancer diagnosis in September 2025. Company: Diesel Advocacy Pty Ltd (Australia).
- Core records stay in an on-device encrypted vault. Privacy-first is central to the brand.

VOICE & VALUES
- Warm, calm, respectful, human. Never fear-based, sensational, or exploitative — this is a sensitive health context.
- Australian English. Inclusive, dignified language about cancer and the people affected by it.
- Ribbonside is an organiser, NOT a medical device and NOT medical advice. Never make medical, diagnostic, treatment, or outcome claims.
- Respect privacy always. Comply with Apple App Store & Google Play rules and Australian Consumer Law / TGA expectations.

THE TEAM (recommend looping in a teammate by writing @TheirTag)
- @ChiefOfStaff — coordinates the team, sets priorities, synthesises.
- @Marketing — brand positioning, messaging and campaign strategy.
- @Ads — paid acquisition: Apple Search Ads, Meta and Google campaigns.
- @Growth — App Store Optimisation (ASO), SEO, social and organic growth.
- @Analytics — download/install tracking and reading what is working.
- @Improve — turns App Store reviews and user feedback into app improvements.
- @Outreach — partnerships, charities, press and community outreach.
- @BlogEditor — drafts, organises and prepares blog posts for ribbonside.com.au.
- @Reviewer — reviews copy for compliance, medical-claim risk and quality before it ships.

HOW YOU WORK
- Be concise, practical and action-oriented. Prefer short structured output (bullets, steps, ready-to-use drafts).
- When a task needs a teammate, say so and tag them with @Tag so the operator can relay it with one click.
- When anything is heading out in public (ads, posts, store copy, outreach), recommend @Reviewer check it first.
- Keep Ribbonside's mission and the wellbeing of people affected by breast cancer at the centre. She is a solo founder — respect her time and budget.`;

const AGENTS = [
  {id:"chief", name:"Chief of Staff", tag:"ChiefOfStaff", emoji:"🎖️", role:"Coordinates the team & sets priorities",
   prompt:"You are the Chief of Staff. Break goals into clear steps, decide which teammate should own each, and synthesise their reports into decisions. For a goal, respond with: a short read of the situation, a prioritised plan, and who does what (tag teammates with @Tag). Keep the founder's time and budget front of mind."},
  {id:"marketing", name:"Marketing", tag:"Marketing", emoji:"📣", role:"Brand & campaign strategy",
   prompt:"You are the Marketing lead. You own brand positioning, messaging and campaign strategy. Craft resonant, tasteful messaging for a sensitive audience — people affected by breast cancer and those who support them. Deliver concrete campaign ideas, taglines and positioning. Never fear-based."},
  {id:"ads", name:"Ads Manager", tag:"Ads", emoji:"📢", role:"Apple Search Ads, Meta & Google",
   prompt:"You are the Ads Manager. You plan and write paid-acquisition campaigns — primarily Apple Search Ads (and Meta/Google where it fits) to drive app installs cost-effectively on a small budget. Give concrete outputs: keyword/audience ideas, ad copy variants, suggested starting budgets and bids, targeting, and what to measure (CPI, tap-through, conversion). Follow Apple, Meta and Google ad policies and health-advertising rules — never make or imply medical claims. Flag anything that should go to @Reviewer."},
  {id:"growth", name:"Growth & ASO", tag:"Growth", emoji:"📈", role:"ASO, SEO, social & organic growth",
   prompt:"You are the Growth & ASO specialist. You grow installs organically: App Store Optimisation (app name, subtitle, keyword field, screenshots, description), SEO for the website, and social/organic tactics. Give specific, ready-to-use outputs and a simple prioritised growth plan. Follow platform policies and health sensitivities. Flag public-facing copy for @Reviewer."},
  {id:"analytics", name:"Downloads & Analytics", tag:"Analytics", emoji:"📊", role:"Tracks installs & what's working",
   prompt:"You are the Downloads & Analytics agent. You help track installs and understand what drives them. Read the numbers the founder gives you (weekly App Store / Google Play downloads, ad spend, conversion) and explain trends, flag what's working or slipping, and recommend the next move. Reference the Growth Tracker figures when given. You cannot pull data automatically — ask the founder to paste figures from App Store Connect / Play Console or log them in the Growth Tracker. Be clear about which number you'd need to go deeper."},
  {id:"improve", name:"Product Improvement", tag:"Improve", emoji:"🔧", role:"Reviews & feedback → improvements",
   prompt:"You are the Product Improvement agent. You turn App Store / Google Play reviews and user feedback into a prioritised list of concrete app improvements and bug themes. Group feedback, estimate impact vs effort, and suggest what to build or fix next. Keep Ribbonside's privacy-first, local-vault design and sensitive audience in mind. Never propose features that would make unproven medical claims."},
  {id:"outreach", name:"Outreach Operator", tag:"Outreach", emoji:"✉️", role:"Partnerships, charities, press",
   prompt:"You are the Outreach Operator. You find and approach partners (breast cancer charities, clinics, support communities), press, and potential ambassadors, and write warm, concise, personalised outreach — emails, DMs, pitches and follow-up sequences. Always respectful and honest; never spammy. Provide ready-to-send drafts with subject lines, clear calls to action and [Name] placeholders. Respect privacy; never fabricate real people's private details."},
  {id:"blog", name:"Blog Editor", tag:"BlogEditor", emoji:"✍️", role:"Drafts & prepares blog posts",
   prompt:"You are the Blog Editor for ribbonside.com.au. You draft calm, genuinely helpful posts for people navigating the practical side of breast cancer, plus their supporters, in Ribbonside's warm, plain-English Australian voice. Never give medical advice — cover practical, organisational, emotional-support and product-adjacent topics, with gentle disclaimers where relevant. When drafting a post, output: a title, a one–two sentence meta description, the full body in Markdown with clear headings, and 3–5 suggested tags."},
  {id:"reviewer", name:"Reviewer", tag:"Reviewer", emoji:"⚖️", role:"Compliance, claims & quality check",
   prompt:"You are the Reviewer. Before anything ships — ads, marketing copy, blog posts, App Store / Play text, outreach — you red-line it against: Apple App Store & Google Play policies, Australian Consumer Law and TGA expectations, and the hard rule that Ribbonside makes NO medical, diagnostic, treatment or outcome claims. You also check brand voice, accuracy and tone for a sensitive audience. Output a clear verdict — PASS or CHANGES NEEDED — then the specific risky lines and a safer rewrite for each."}
];
const AGENT_BY_ID = Object.fromEntries(AGENTS.map(a=>[a.id,a]));

let state = load();
let current = "chief";
let busy = {};

function load(){ try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)); if(s&&typeof s==="object") return normalize(s); }catch(e){} return normalize({}); }
function normalize(s){
  s.apiKey=s.apiKey||""; s.model=MODELS.some(m=>m.id===s.model)?s.model:"claude-sonnet-5"; s.pinHash=s.pinHash||"";
  s.chats=s.chats||{}; AGENTS.forEach(a=>{ if(!Array.isArray(s.chats[a.id])) s.chats[a.id]=[]; });
  s.comms=Array.isArray(s.comms)?s.comms:[]; s.blog=Array.isArray(s.blog)?s.blog:[]; s.metrics=Array.isArray(s.metrics)?s.metrics:[];
  s.lastBackup=s.lastBackup||0; s.changesSinceBackup=s.changesSinceBackup||0; return s;
}
let saveTimer=null;
function save(count){ if(count!==false) state.changesSinceBackup=(state.changesSinceBackup||0)+1; clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ try{ localStorage.setItem(STORE_KEY,JSON.stringify(state)); }catch(e){} },150); }

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstElementChild;}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2600);}
function fmtTime(ts){const d=new Date(ts);return d.toLocaleString("en-AU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}
function slugify(s){return (s||"post").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60)||"post";}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
async function sha256(s){ if(!(window.crypto&&crypto.subtle)) return "plain:"+s; const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function mdToHtml(src){
  const lines=esc(src||"").split("\n"); let out=[],list=null;
  const closeList=()=>{ if(list){ out.push(list==="ul"?"</ul>":"</ol>"); list=null; } };
  const inline=(t)=>t.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|mailto:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for(let raw of lines){ const l=raw.replace(/\s+$/,"");
    if(/^###\s+/.test(l)){closeList();out.push("<h3>"+inline(l.replace(/^###\s+/,""))+"</h3>");continue;}
    if(/^##\s+/.test(l)){closeList();out.push("<h2>"+inline(l.replace(/^##\s+/,""))+"</h2>");continue;}
    if(/^#\s+/.test(l)){closeList();out.push("<h1>"+inline(l.replace(/^#\s+/,""))+"</h1>");continue;}
    if(/^\s*[-*]\s+/.test(l)){ if(list!=="ul"){closeList();out.push("<ul>");list="ul";} out.push("<li>"+inline(l.replace(/^\s*[-*]\s+/,""))+"</li>"); continue; }
    if(/^\s*\d+\.\s+/.test(l)){ if(list!=="ol"){closeList();out.push("<ol>");list="ol";} out.push("<li>"+inline(l.replace(/^\s*\d+\.\s+/,""))+"</li>"); continue; }
    if(l.trim()===""){ closeList(); continue; } out.push("<p>"+inline(l)+"</p>");
  } closeList(); return out.join("\n");
}
const PREVIEW_REPLY = "🔍 **This is a live preview** so you can explore Mission Control — every agent, the relay, the Growth Tracker, the blog board and the backup tools are all clickable here.\n\nMy real replies switch on when this page runs on your own site at **ribbonside.com.au/mission-control/**, where it can reach Claude with your API key. (A published preview like this can't make that call, for security reasons.)\n\nIn the meantime, Vanessa, you can also just ask me — Claude, in your chat — to act as any of these agents and I'll produce the real work there.";

async function callClaude({system, messages, maxTokens=4096, onDelta}){
  if(!state.apiKey) throw new Error("No API key set. Open Settings and add your Anthropic API key.");
  const res=await fetch(API_URL,{method:"POST",headers:{"content-type":"application/json","x-api-key":state.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:state.model,max_tokens:maxTokens,system,messages,stream:true})});
  if(!res.ok){ let d=""; try{ const j=await res.json(); d=j.error?.message||JSON.stringify(j); }catch(e){ d=await res.text(); } throw new Error(`API ${res.status}: ${d}`); }
  const reader=res.body.getReader(),dec=new TextDecoder(); let buf="",full="";
  while(true){ const {done,value}=await reader.read(); if(done)break; buf+=dec.decode(value,{stream:true}); let i;
    while((i=buf.indexOf("\n"))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+1); if(!line.startsWith("data:"))continue; const data=line.slice(5).trim(); if(!data||data==="[DONE]")continue;
      try{ const ev=JSON.parse(data); if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.type==="text_delta"){ full+=ev.delta.text; onDelta&&onDelta(full); } else if(ev.type==="error"){ throw new Error(ev.error?.message||"stream error"); } }catch(e){ if(e instanceof SyntaxError)continue; throw e; } } }
  return full;
}
function agentMessages(agentId){ return state.chats[agentId].map(m=>({role:m.role,content:m.content})); }
function agentSystem(agentId){ const a=AGENT_BY_ID[agentId]; return SHARED_BRIEF+"\n\nYOUR ROLE\nYou are "+a.name+" (@"+a.tag+"). "+a.prompt; }

async function runAgent(agentId,{maxTokens=4096,commsFrom=null}={}){
  if(busy[agentId])return; busy[agentId]=true; const chat=state.chats[agentId];
  if(PREVIEW){ chat.push({role:"assistant",content:PREVIEW_REPLY,ts:Date.now(),streaming:false}); save(); busy[agentId]=false; if(current===agentId)renderMain(); renderSidebar();
    if(commsFrom) logComms({from:AGENT_BY_ID[agentId].name,to:AGENT_BY_ID[commsFrom]?.name||"Team",text:"(preview) "+AGENT_BY_ID[agentId].name+" acknowledged the hand-off.",kind:"reply"}); return; }
  const msg={role:"assistant",content:"",ts:Date.now(),streaming:true}; chat.push(msg); if(current===agentId)renderMain();
  try{ const full=await callClaude({system:agentSystem(agentId),messages:agentMessages(agentId).filter(m=>!m.streaming),maxTokens,onDelta:(txt)=>{ msg.content=txt; if(current===agentId)updateStreaming(agentId,txt); }});
    msg.content=full; msg.streaming=false; save(); if(commsFrom) logComms({from:AGENT_BY_ID[agentId].name,to:AGENT_BY_ID[commsFrom]?.name||"Team",text:full,kind:"reply"});
  }catch(e){ msg.content=(/Failed to fetch|NetworkError/i.test(e.message)?"⚠️ Couldn't reach Claude from here. Live replies run on your own site (ribbonside.com.au/mission-control) with your API key.":"⚠️ "+e.message); msg.streaming=false; msg.error=true; save(); toast(e.message.slice(0,120)); }
  finally{ busy[agentId]=false; if(current===agentId)renderMain(); renderSidebar(); }
}
function logComms(entry){ state.comms.push(Object.assign({ts:Date.now()},entry)); if(state.comms.length>500)state.comms=state.comms.slice(-500); save(); renderSidebar(); if(current==="comms")renderMain(); }
async function relay(fromId,toId,text){ const from=AGENT_BY_ID[fromId],to=AGENT_BY_ID[toId];
  state.chats[toId].push({role:"user",content:"**Relayed from "+from.name+" (@"+from.tag+"):**\n\n"+text+"\n\n_Please review and respond as "+to.name+"._",ts:Date.now(),from:from.name});
  logComms({from:from.name,to:to.name,text:text,kind:"relay"}); current=toId; renderSidebar(); renderMain(); toast("Relayed to "+to.name); await runAgent(toId,{commsFrom:fromId}); }

function renderChat(agentId){

  if(agentId==="chief") actions=`<button class="btn sm" onclick="openBroadcast()">📢 Broadcast to team</button>`+actions;

  if(agentId==="analytics") actions=`<button class="btn sm" onclick="selectView('tracker')">Open Growth Tracker</button>`+actions;

  body.innerHTML=`<div class="chat-wrap"><div class="msgs" id="msgs"><div class="inner" id="msgsInner"></div></div>
    <div class="composer"><div class="inner"><textarea id="composer" placeholder="Message ${a.name}…" rows="1"></textarea><button class="send" id="sendBtn" title="Send">➤</button></div>

function renderMessages(agentId){
  const inner=document.getElementById("msgsInner"); if(!inner)return; const chat=state.chats[agentId];
  if(chat.length===0){ const a=AGENT_BY_ID[agentId]; inner.innerHTML=`<div class="empty"><div class="em">${a.emoji}</div><h2>${a.name}</h2><p>${esc(a.role)}. Ask a question or hand over a task — I'll flag any teammate who should help.</p></div>`; return; }
  inner.innerHTML=""; chat.forEach((m,i)=>inner.appendChild(msgNode(agentId,m,i))); scrollMsgs();
}
function msgNode(agentId,m){
  const a=AGENT_BY_ID[agentId]; const isUser=m.role==="user";
  const who=isUser?(m.from?`You <span class="frm">· via ${esc(m.from)}</span>`:"You"):a.name; const av=isUser?"🧑‍💼":a.emoji;
  const node=el(`<div class="msg ${isUser?"user":""}"><div class="av">${av}</div><div class="bub"><div class="who">${who}</div><div class="txt">${isUser?esc(m.content).replace(/\n/g,"<br>"):mdToHtml(m.content)}</div></div></div>`);
  if(!isUser&&m.content&&!m.streaming){
    const others=AGENTS.filter(x=>x.id!==agentId); const mentioned=others.filter(x=>new RegExp("@"+x.tag+"\\b","i").test(m.content));
    const bar=el(`<div class="relaybar"><span class="lbl">Relay this to →</span></div>`); const shown=mentioned.length?mentioned:others;
    shown.slice(0,mentioned.length?mentioned.length:7).forEach(x=>{ const c=el(`<button class="chip ${mentioned.includes(x)?"suggest":""}">${x.emoji} ${x.name}</button>`); c.onclick=()=>relay(agentId,x.id,m.content); bar.appendChild(c); });
    node.querySelector(".bub").appendChild(bar);
  } return node;
}
function updateStreaming(agentId,txt){ const inner=document.getElementById("msgsInner"); if(!inner)return; const last=inner.querySelector(".msg:last-child .txt"); if(last){ last.innerHTML=mdToHtml(txt); scrollMsgs(); } }
function scrollMsgs(){ const m=document.getElementById("msgs"); if(m)m.scrollTop=m.scrollHeight; }
async function sendMessage(agentId){ const ta=document.getElementById("composer"); const text=ta.value.trim(); if(!text)return; ta.value=""; ta.style.height="auto"; state.chats[agentId].push({role:"user",content:text,ts:Date.now()}); save(); renderMessages(agentId); await runAgent(agentId); }

/* ---- Growth Tracker (download tracking) ---- */
function renderTracker(){
  setTop("📊 Growth Tracker","Log installs over time — your Downloads & Analytics agent reads these",`<button class="btn sm pri" onclick="addMetric()">+ Add entry</button>`);
  const body=document.getElementById("viewBody");
  const rows=[...state.metrics].sort((a,b)=> a.date<b.date?-1:1);
  const totals=rows.map(r=>(+r.ios||0)+(+r.android||0));
  const grand=totals.reduce((s,n)=>s+n,0);
  body.innerHTML=`<div class="panel-wrap">
    <div class="panel"><h3>📈 Installs trend</h3><p class="d">Total downloads per entry (iOS + Android). Cumulative so far: <b>${grand}</b></p>
      ${rows.length?sparkline(totals):'<p class="d">No data yet — add your first download numbers to see the trend.</p>'}</div>
    <div class="panel"><h3>Entries</h3>
      ${rows.length?`<table class="mx"><tr><th>Date</th><th>iOS</th><th>Android</th><th>Total</th><th>Note</th><th></th></tr>
      ${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${+r.ios||0}</td><td>${+r.android||0}</td><td><b>${(+r.ios||0)+(+r.android||0)}</b></td><td>${esc(r.note||"")}</td><td><button class="mini" onclick="delMetric('${r.id}')">✕</button></td></tr>`).join("")}</table>`:'<p class="d">No entries yet.</p>'}
      <div class="row" style="margin-top:12px"><button class="btn" onclick="handToAnalytics()">📊 Hand these numbers to the Analytics agent</button></div>
      <div class="note">Paste your weekly totals from <b>App Store Connect → Analytics → App Units</b> and <b>Google Play Console → Statistics</b>. This tool can't pull them automatically, but your Downloads &amp; Analytics agent will read whatever you log here and tell you what's working.</div></div>
  </div>`;
}
function sparkline(vals){ if(!vals.length)return ""; const w=Math.max(vals.length*44,160),h=64,max=Math.max(...vals,1);
  const pts=vals.map((v,i)=>`${(i/Math.max(vals.length-1,1))*w},${(h-(v/max)*h).toFixed(1)}`).join(" ");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="max-height:84px;display:block"><polyline fill="none" stroke="#EB94AE" stroke-width="2.5" points="${pts}"/></svg><div class="kv">Latest: <b>${vals[vals.length-1]}</b> · Peak: <b>${max}</b> · Entries: <b>${vals.length}</b></div>`;
}
function addMetric(){ const date=prompt("Date (YYYY-MM-DD):",new Date().toISOString().slice(0,10)); if(!date)return; const ios=prompt("iOS downloads for this period:","0"); if(ios===null)return; const android=prompt("Android downloads for this period:","0"); if(android===null)return; const note=prompt("Note (optional, e.g. 'started Apple Search Ads'):","")||""; state.metrics.push({id:uid(),date,ios:+ios||0,android:+android||0,note}); save(); renderTracker(); renderSidebar(); toast("Entry added"); }
function delMetric(id){ state.metrics=state.metrics.filter(m=>m.id!==id); save(); renderTracker(); renderSidebar(); }
function handToAnalytics(){
  if(!state.metrics.length){ toast("Add some numbers first"); return; }
  const rows=[...state.metrics].sort((a,b)=>a.date<b.date?-1:1);
  const summary="Here are my latest Ribbonside download numbers — what's working and what should I do next?\n\n"+rows.map(r=>`- ${r.date}: iOS ${+r.ios||0}, Android ${+r.android||0}, total ${(+r.ios||0)+(+r.android||0)}${r.note?" ("+r.note+")":""}`).join("\n");
  selectView("analytics"); const ta=document.getElementById("composer"); if(ta){ ta.value=summary; ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,180)+"px"; ta.focus(); } toast("Prefilled for the Analytics agent — press send");
}

function cardNode(p){ const idx=STATUSES.indexOf(p.status);
  const node=el(`<div class="card"><div class="ct">${esc(p.title||"Untitled")}</div>${p.meta?`<div class="cd">${esc(p.meta)}</div>`:""}${p.scheduledDate?`<div class="sched">📅 ${esc(p.scheduledDate)}</div>`:""}<div class="crow" style="margin-top:8px"><button class="mini" data-a="edit">Edit</button><button class="mini" data-a="preview">Preview</button><button class="mini" data-a="export">Export HTML</button>${idx>0?`<button class="mini" data-a="left">◀</button>`:""}${idx<STATUSES.length-1?`<button class="mini" data-a="right">▶</button>`:""}</div></div>`);

function movePost(id,dir){ const p=state.blog.find(x=>x.id===id); if(!p)return; const i=STATUSES.indexOf(p.status)+dir; if(i<0||i>=STATUSES.length)return; p.status=STATUSES[i]; p.updatedTs=Date.now(); save(); renderBlog(); renderSidebar(); }

function readPostForm(){ return { title:document.getElementById("pTitle").value.trim(), status:document.getElementById("pStatus").value, scheduledDate:document.getElementById("pDate").value, meta:document.getElementById("pMeta").value.trim(), tags:document.getElementById("pTags").value.trim(), body:document.getElementById("pBody").value }; }
function savePost(id){ const data=readPostForm(); if(!data.title){toast("Give the post a title");return;} if(id){ const p=state.blog.find(x=>x.id===id); Object.assign(p,data,{updatedTs:Date.now()}); } else { state.blog.push(Object.assign({id:uid(),createdTs:Date.now(),updatedTs:Date.now()},data)); } save(); closeModal(); renderBlog(); renderSidebar(); toast("Post saved"); }
async function draftPost(id){
  if(PREVIEW){ toast("Live AI drafting runs on your own site (ribbonside.com.au/mission-control)"); return; }
  if(!state.apiKey){toast("Add your API key in Settings first");return;} const data=readPostForm(); if(!data.title){toast("Add a title or a rough idea first");return;}
  const btn=document.getElementById("pDraft"); btn.disabled=true; btn.textContent="Drafting…"; const bodyTa=document.getElementById("pBody");
  const prompt=`Draft a full Ribbonside blog post.\nWorking title / idea: "${data.title}"\n${data.body?"Existing notes:\n"+data.body+"\n":""}${data.tags?"Preferred tags: "+data.tags+"\n":""}\nReturn ONLY the post body in Markdown with clear headings (no title line, no meta line). Then on the very last two lines:\nMETA: <one–two sentence meta description>\nTAGS: <3–5 comma separated tags>`;
  try{ let full=""; await callClaude({system:agentSystem("blog"),messages:[{role:"user",content:prompt}],maxTokens:8000,onDelta:(t)=>{ full=t; bodyTa.value=t; }});
    const mm=full.match(/^META:\s*(.+)$/mi),tm=full.match(/^TAGS:\s*(.+)$/mi); if(mm)document.getElementById("pMeta").value=mm[1].trim(); if(tm)document.getElementById("pTags").value=tm[1].trim(); bodyTa.value=full.replace(/^META:.*$/mi,"").replace(/^TAGS:.*$/mi,"").trim(); toast("Draft ready — review & edit before publishing");
  }catch(e){ toast(e.message.slice(0,120)); } finally{ btn.disabled=false; btn.textContent="✨ Draft with Blog Editor"; }
}
function previewPost(id){ const p=state.blog.find(x=>x.id===id); if(!p)return; openModal(`<h3>${esc(p.title||"Untitled")}</h3>${p.meta?`<p class="d" style="color:var(--muted);font-size:13px;margin-bottom:14px">${esc(p.meta)}</p>`:""}<div class="prose">${mdToHtml(p.body)}</div><div class="foot"><button class="btn" onclick="closeModal()">Close</button><button class="btn pri" onclick="exportPost('${p.id}')">Export publish-ready HTML</button></div>`); }
function buildBlogHTML(p){ const tags=(p.tags||"").split(",").map(t=>t.trim()).filter(Boolean); const date=p.scheduledDate||new Date().toISOString().slice(0,10);
  return `<!DOCTYPE html>\n<html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${esc(p.title)} — Ribbonside</title><meta name="description" content="${esc(p.meta)}"><link rel="canonical" href="https://ribbonside.com.au/blog/${slugify(p.title)}.html"><link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--cream:#FDFAF8;--pink:#EB94AE;--ink:#1E1414;--muted:#7A6060;--border:#EAE0E0;--pink-light:#FFF0F5}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif;line-height:1.7}nav{height:60px;padding:0 6%;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}nav .b{font-family:"Lora",serif;font-weight:600;color:var(--ink);text-decoration:none}nav a.back{margin-left:auto;font-size:13px;color:var(--muted);text-decoration:none}article{max-width:720px;margin:0 auto;padding:48px 24px 72px}.eyebrow{color:var(--pink);font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}h1{font-family:"Lora",serif;font-size:clamp(30px,5vw,44px);line-height:1.15;margin:10px 0 8px}.meta{color:var(--muted);font-size:14px;margin-bottom:8px}.tags{margin:14px 0 26px;display:flex;gap:8px;flex-wrap:wrap}.tags span{font-size:12px;background:var(--pink-light);border:1px solid #F2C4D4;color:#a24d67;border-radius:20px;padding:3px 10px}.prose h2{font-family:"Lora",serif;font-size:24px;margin:1.4em 0 .4em}.prose h3{font-family:"Lora",serif;font-size:19px;margin:1.2em 0 .3em}.prose p{margin:1em 0;font-size:17px}.prose ul,.prose ol{margin:1em 0 1em 1.3em}.prose li{margin:.4em 0}.prose a{color:var(--pink)}.disclaimer{margin-top:40px;padding:16px 18px;background:#fff;border:1px solid var(--border);border-radius:12px;font-size:13px;color:var(--muted)}footer{padding:28px 6%;border-top:1px solid var(--border);color:var(--muted);font-size:13px;text-align:center}</style></head><body><nav><a class="b" href="/">Ribbonside</a><a class="back" href="/blog/">← All articles</a></nav><article><div class="eyebrow">Ribbonside Journal</div><h1>${esc(p.title)}</h1><div class="meta">${new Date(date).toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"})}</div>${tags.length?`<div class="tags">${tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}<div class="prose">\n${mdToHtml(p.body)}\n</div><div class="disclaimer">Ribbonside is a private organiser for the practical side of breast cancer. It is not a medical device and does not provide medical advice. Always speak with your care team about your health.</div></article><footer>© ${new Date().getFullYear()} Diesel Advocacy Pty Ltd · Ribbonside · <a href="/">ribbonside.com.au</a></footer></body></html>`;
}
function exportPost(id){ const p=state.blog.find(x=>x.id===id); if(!p)return; if(!p.body.trim()){toast("Add some body text first");return;}
  download(`ribbonside-blog-${slugify(p.title)}.html`,buildBlogHTML(p),"text/html");
  openModal(`<h3>✅ Publish-ready HTML exported</h3><p class="d" style="color:var(--muted);font-size:13.5px;margin-bottom:12px">Downloaded <code>ribbonside-blog-${slugify(p.title)}.html</code>, styled to match ribbonside.com.au.</p><div class="note"><b>To publish:</b> add this file to a <code>/blog/</code> folder in your website repo and commit — it goes live at <code>ribbonside.com.au/blog/${slugify(p.title)}.html</code>.</div><div class="foot"><button class="btn pri" onclick="closeModal()">Got it</button></div>`);
}

/* ---- Backup & Security ---- */
function renderBackup(){
  setTop("🛡️ Backup &amp; Security","Protect your work and keep it backed up","");
  const body=document.getElementById("viewBody"); const last=state.lastBackup?fmtTime(state.lastBackup):"never"; const stale=!state.lastBackup||(Date.now()-state.lastBackup>7*864e5); const pending=state.changesSinceBackup||0;
  const checks=[
    {ok:!!state.apiKey,warn:!state.apiKey,txt:state.apiKey?"Anthropic API key configured (stored only in this browser)":"No API key yet — add one in Settings"},
    {ok:!!state.pinHash,warn:!state.pinHash,txt:state.pinHash?"Device PIN lock is set":"No device PIN lock set — anyone using this browser can open Mission Control"},
    {ok:!stale,warn:stale,txt:state.lastBackup?("Last backup: "+last+(stale?" — over a week ago":"")):"You haven't downloaded a backup yet"},
    {ok:pending===0,warn:pending>0,txt:pending>0?(pending+" change"+(pending>1?"s":"")+" since your last backup"):"All changes are backed up"}
  ];
  body.innerHTML=`<div class="panel-wrap">
    <div class="panel"><h3>💾 Backups</h3><p class="d">Everything in Mission Control lives in this browser. Export a backup regularly so nothing is lost if the browser is cleared or you switch devices.</p>
      <div class="kv">Last backup: <b>${last}</b> · Unsaved-to-file changes: <b>${pending}</b></div>
      <div class="row" style="margin-top:12px"><button class="btn pri" onclick="exportBackup(false)">⬇ Download backup (no API key)</button><button class="btn" onclick="exportBackup(true)">Full backup (includes key)</button><button class="btn" onclick="document.getElementById('restoreFile').click()">⬆ Restore</button><input type="file" id="restoreFile" accept="application/json" style="display:none" onchange="restoreBackup(event)"></div>
      <div class="note">The “no API key” backup is safe to store anywhere. Only the full backup contains your secret key — keep that one private.</div></div>
    <div class="panel"><h3>✅ Security posture</h3><p class="d">A quick read on how protected this setup is right now.</p>${checks.map(c=>`<div class="check"><span class="ic ${c.ok?"ok":"warn"}">${c.ok?"✔":"⚠"}</span><span>${esc(c.txt)}</span></div>`).join("")}</div>
    <div class="panel"><h3>🔐 Device lock (PIN)</h3><p class="d">Optional. Requires a PIN to open Mission Control in <i>this</i> browser — a convenience lock stored on your device, not server-grade security.</p><div class="row"><button class="btn" onclick="setPin()">${state.pinHash?"Change PIN":"Set a PIN"}</button>${state.pinHash?`<button class="btn danger" onclick="removePin()">Remove PIN</button>`:""}</div></div>
    <div class="panel"><h3 style="color:var(--danger)">⚠ Danger zone</h3><p class="d">Permanently erase all conversations, comms, download data, blog drafts and settings from this browser.</p><button class="btn danger" onclick="wipeAll()">Erase everything</button></div></div>`;
}
function exportBackup(withKey){ const copy=JSON.parse(JSON.stringify(state)); if(!withKey)copy.apiKey=""; copy._exported=new Date().toISOString(); download(`ribbonside-mission-control-backup-${new Date().toISOString().slice(0,10)}${withKey?"-FULL":""}.json`,JSON.stringify(copy,null,2),"application/json"); state.lastBackup=Date.now(); state.changesSinceBackup=0; save(false); renderSidebar(); renderMain(); toast("Backup downloaded"); }
function restoreBackup(ev){ const f=ev.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result); if(!confirm("Restore this backup? It replaces your current Mission Control data in this browser."))return; const key=data.apiKey||state.apiKey; state=normalize(data); if(!state.apiKey)state.apiKey=key; save(false); current="chief"; renderSidebar(); renderMain(); toast("Backup restored"); }catch(e){ toast("That file couldn't be read as a backup"); } }; r.readAsText(f); ev.target.value=""; }
async function setPin(){ const pin=prompt("Set a PIN (4+ digits) to open Mission Control on this device:"); if(pin===null)return; if(pin.length<4){toast("Use at least 4 characters");return;} state.pinHash=await sha256(pin); save(false); renderMain(); toast("PIN set"); }
function removePin(){ if(confirm("Remove the device PIN lock?")){ state.pinHash=""; save(false); renderMain(); toast("PIN removed"); } }
function wipeAll(){ if(!confirm("Erase ALL Mission Control data in this browser? This cannot be undone."))return; if(!confirm("Really erase everything? Download a backup first."))return; localStorage.removeItem(STORE_KEY); location.reload(); }

/* ---- Settings ---- */
function renderSettings(){
  setTop("⚙️ Settings","API key, model and preferences","");
  const body=document.getElementById("viewBody");
  body.innerHTML=`<div class="panel-wrap">
    <div class="panel"><h3>🔑 Anthropic API key</h3><p class="d">Your agents call Claude directly from the browser using your key. It's saved only in this browser and sent only to api.anthropic.com.${PREVIEW?" <b>Note:</b> in this shared preview the browser can't make that call — it works once the page is on your own site.":""}</p>
      <div class="field"><label>API key</label><input id="setKey" type="password" placeholder="sk-ant-…" value="${esc(state.apiKey)}"></div>
      <div class="row"><button class="btn pri" onclick="saveKey()">Save key</button>${PREVIEW?"":`<button class="btn" onclick="testKey()">Test connection</button>`}<a class="btn" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" style="text-decoration:none">Get a key ↗</a></div></div>
    <div class="panel"><h3>🧠 Model</h3><p class="d">Which Claude model powers your agents. Sonnet 5 balances quality, speed and cost; Opus 4.8 is most capable; Haiku 4.5 is fastest and cheapest.</p><div class="field"><select id="setModel" onchange="saveModel()">${MODELS.map(m=>`<option value="${m.id}" ${state.model===m.id?"selected":""}>${m.name}</option>`).join("")}</select></div></div>
    <div class="panel"><h3>ℹ️ About</h3><p class="d">A private ops cockpit for Ribbonside: nine Claude-powered teammates for ads, marketing, growth, downloads, improvement, outreach, blogging, review and coordination.</p><div class="note">On your own site this page is <b>noindex</b> and blocked in robots.txt. It holds no secrets of its own — your API key lives only in your browser. Keep the URL private and set a device PIN for casual protection.</div></div></div>`;
}
function saveKey(){ state.apiKey=document.getElementById("setKey").value.trim(); save(false); renderSidebar(); toast(state.apiKey?"API key saved":"API key cleared"); }
function saveModel(){ state.model=document.getElementById("setModel").value; save(false); renderSidebar(); toast("Model set to "+state.model.replace("claude-","")); }
async function testKey(){ const k=document.getElementById("setKey").value.trim(); if(!k){toast("Enter a key first");return;} state.apiKey=k; save(false); toast("Testing…"); try{ await callClaude({system:"Reply with just: ok",messages:[{role:"user",content:"ping"}],maxTokens:16}); toast("✅ Connection works"); }catch(e){ toast("❌ "+e.message.slice(0,120)); } }

function openModal(html){ document.getElementById("modal").innerHTML=html; document.getElementById("overlay").classList.add("on"); }
function closeModal(){ document.getElementById("overlay").classList.remove("on"); }
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay")closeModal(); });
function download(name,content,type){ const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); }

async function checkLock(){ if(state.pinHash){ document.getElementById("lock").classList.add("on"); const inp=document.getElementById("lockpin"),err=document.getElementById("lockerr"); const attempt=async()=>{ const h=await sha256(inp.value); if(h===state.pinHash){ document.getElementById("lock").classList.remove("on"); } else { err.textContent="Incorrect PIN"; inp.value=""; inp.focus(); } }; document.getElementById("lockbtn").onclick=attempt; inp.addEventListener("keydown",e=>{ if(e.key==="Enter")attempt(); }); inp.focus(); } }

function boot(){ if(PREVIEW){ const bar=document.getElementById("previewBar"); bar.style.display="flex"; bar.innerHTML=`<span>🔍 <b>Live preview</b> — click through every agent & panel. Real AI replies switch on when this runs on your own site with your API key.</span><button onclick="this.parentElement.style.display='none'">hide</button>`; } renderSidebar(); current="chief"; renderMain(); checkLock(); }
boot();
</script>
