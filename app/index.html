<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FDFAF8">
<title>Get Ribbonside</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://ribbonside.com.au/app/">
<link rel="icon" type="image/png" href="../ribbonside-ribbon-logo.png">
<style>
:root{
  --cream:#FDFAF8;
  --ink:#1E1414;
  --muted:#7A6060;
  --line:#EAE0E0;
  --pink:#EB94AE;
  --pink-soft:#FFF0F5;
}
*{box-sizing:border-box}
body{
  min-height:100vh;
  margin:0;
  display:grid;
  place-items:center;
  padding:28px;
  background:var(--cream);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
main{
  width:min(720px,100%);
  text-align:center;
}
.logo{
  width:58px;
  height:58px;
  margin:0 auto 18px;
  border-radius:999px;
}
h1{margin:0 0 12px;font-size:34px;line-height:1.08}
.lead{margin:0 auto 26px;max-width:560px;color:var(--muted);line-height:1.55}
.store-grid{
  width:min(480px,100%);
  display:grid;
  gap:12px;
  margin-left:auto;
  margin-right:auto;
  margin-top:18px;
}
.store-card{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:16px;
  padding:22px;
  border:1px solid var(--line);
  border-radius:8px;
  background:white;
  text-align:left;
}
.store-card h2{margin:0;font-size:20px}
.store-card p{margin:8px 0 0;color:var(--muted);line-height:1.45}
.store-card a,
.store-card span[aria-disabled="true"]{
  min-height:48px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0 18px;
  border-radius:999px;
  background:var(--ink);
  color:white;
  font-weight:800;
  text-decoration:none;
}
.store-card span[aria-disabled="true"]{
  background:var(--pink-soft);
  color:var(--muted);
}
.android-test-status{
  width:max-content;
  max-width:100%;
  min-height:32px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin:2px auto 0;
  padding:6px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:white;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.android-test-status::before{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--pink);
  content:"";
}
.note{
  margin:24px auto 0;
  max-width:560px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}
.note a{color:var(--ink);font-weight:800}
@media(max-width:640px){
  body{padding:22px}
  .store-grid{grid-template-columns:1fr}
  h1{font-size:30px}
}
</style>
</head>
<body>
<main>
  <img class="logo" src="../ribbonside-ribbon-logo.png" width="256" height="256" alt="">
  <h1>Get Ribbonside</h1>
  <p class="lead">Download Ribbonside for iPhone from the App Store.</p>
  <div class="store-grid" aria-label="Store options">
    <section class="store-card">
      <div>
        <h2>iPhone</h2>
        <p>Download Ribbonside from the App Store.</p>
      </div>
      <a href="https://apps.apple.com/au/app/ribbonside/id6773605047">Open App Store</a>
    </section>
    <div class="android-test-status">Android - currently in testing</div>
  </div>
  <p class="note">Need help? Contact <a href="mailto:support@ribbonside.com.au">support@ribbonside.com.au</a>.</p>
</main>
</body>
</html>
