<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Ribbonside on the App Store</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://apps.apple.com/au/app/ribbonside/id6773605047">
<meta http-equiv="refresh" content="0; url=https://apps.apple.com/au/app/ribbonside/id6773605047">
<script>
  window.location.replace("https://apps.apple.com/au/app/ribbonside/id6773605047");
</script>
<style>
:root{
  --cream:#FDFAF8;
  --ink:#1E1414;
  --muted:#7A6060;
}
*{box-sizing:border-box}
body{
  min-height:100vh;
  margin:0;
  display:grid;
  place-items:center;
  padding:28px;
  background:var(--cream);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-align:center;
}
main{max-width:420px}
h1{margin:0 0 12px;font-size:28px;line-height:1.15}
p{margin:0 0 22px;color:var(--muted);line-height:1.5}
a{
  display:inline-flex;
  min-height:48px;
  align-items:center;
  justify-content:center;
  padding:0 20px;
  border-radius:999px;
  background:var(--ink);
  color:white;
  font-weight:800;
  text-decoration:none;
}
</style>
</head>
<body>
<main>
  <h1>Opening the App Store...</h1>
  <p>If it does not open automatically, use the button below.</p>
  <a href="https://apps.apple.com/au/app/ribbonside/id6773605047">Open Ribbonside on the App Store</a>
