<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ribbonside</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--pink:#D4325F;--pink-light:#FFF0F5;--cream:#FDFAF8;--charcoal:#1E1414;--muted:#7A6060;--border:#EAE0E0;}
  html,body{height:100%;}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--charcoal);display:flex;flex-direction:column;min-height:100vh;}

  nav{background:white;border-bottom:1px solid var(--border);padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .logo{width:32px;height:32px;border-radius:50%;background:var(--pink);border:2.5px solid var(--pink);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .brand-name{font-family:'Lora',serif;font-size:16px;font-weight:600;color:var(--charcoal);}
  nav a.support{font-size:13px;color:var(--muted);text-decoration:none;}
  nav a.support:hover{color:var(--pink);}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;}
  .logo-large{width:72px;height:72px;border-radius:50%;background:var(--pink);border:4px solid var(--pink);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 28px;box-shadow:0 8px 32px rgba(212,50,95,0.25);}
  h1{font-family:'Lora',serif;font-size:clamp(28px,5vw,42px);color:var(--charcoal);margin-bottom:12px;line-height:1.2;}
  h1 em{font-style:italic;color:var(--pink);}
  .tagline{font-size:15px;color:var(--muted);margin-bottom:48px;max-width:380px;line-height:1.7;}
  .contact-link{display:inline-flex;align-items:center;gap:8px;background:white;border:1.5px solid var(--border);border-radius:24px;padding:10px 22px;font-size:13px;color:var(--muted);text-decoration:none;transition:all .15s;}
  .contact-link:hover{border-color:var(--pink);color:var(--pink);}

  footer{background:white;border-top:1px solid var(--border);padding:18px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .footer-copy{font-size:12px;color:var(--muted);}
  .footer-links{display:flex;gap:20px;}
  .footer-links a{font-size:12px;color:var(--muted);text-decoration:none;transition:color .15s;}
  .footer-links a:hover{color:var(--pink);}

  @media(max-width:480px){
    nav,footer{padding:0 20px;height:auto;min-height:56px;}
    footer{padding:16px 20px;}
  }
</style>
</head>
<body>

<nav>
  <div class="brand">
    <div class="logo"><span style="filter:brightness(0) invert(1);">🎗️</span></div>
    <span class="brand-name">Ribbonside</span>
  </div>
  <a href="mailto:support@ribbonside.com.au" class="support">support@ribbonside.com.au</a>
</nav>

<main>
  <div class="logo-large"><span style="filter:brightness(0) invert(1);">🎗️</span></div>
  <h1>Ribbonside<br><em>Coming Soon</em></h1>
  <p class="tagline">Something is on its way. Get in touch if you have any questions.</p>
  <a href="mailto:support@ribbonside.com.au" class="contact-link">✉ support@ribbonside.com.au</a>
</main>

<footer>
  <span class="footer-copy">© 2026 Diesel Advocacy Pty Ltd · ABN 82 690 643 853</span>
  <div class="footer-links">
    <a href="legal.html">Privacy Policy</a>
    <a href="legal.html">Terms of Use</a>
    <a href="legal.html">Legal</a>
  </div>
</footer>

</body>
</html>
